{% extends "base.html" %}
{% block title %}Register - Job Cost Tracker{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16" x-data="{ name: '', email: '', password: '', error: '' }">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Job Cost Tracker</h1>
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-lg font-semibold mb-4">Create Account</h2>
        <div x-show="error" class="bg-red-50 text-red-700 p-3 rounded mb-4 text-sm" x-text="error"></div>
        <form @submit.prevent="
            error = '';
            fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({display_name: name, email, password})
            }).then(async r => {
                if (!r.ok) { error = (await r.json()).detail; return; }
                // Auto-login after register
                return fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
            }).then(r => {
                if (r && r.ok) window.location.href = '/';
            }).catch(e => error = e.message)
        ">
            <label class="block mb-3">
                <span class="text-sm font-medium text-gray-700">Display Name</span>
                <input type="text" x-model="name" required class="mt-1 block w-full rounded border-gray-300 shadow-sm px-3 py-2 border focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </label>
            <label class="block mb-3">
                <span class="text-sm font-medium text-gray-700">Email</span>
                <input type="email" x-model="email" required class="mt-1 block w-full rounded border-gray-300 shadow-sm px-3 py-2 border focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </label>
            <label class="block mb-4">
                <span class="text-sm font-medium text-gray-700">Password</span>
                <input type="password" x-model="password" required minlength="8" class="mt-1 block w-full rounded border-gray-300 shadow-sm px-3 py-2 border focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </label>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">Create Account</button>
        </form>
        <p class="mt-4 text-sm text-gray-600 text-center">
            Have an account? <a href="/login" class="text-blue-600 hover:underline">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
